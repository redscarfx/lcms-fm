[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundation-lcms"
version = "0.1.0"
description = "Foundation model research framework for untargeted LC-HRMS metabolomics"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Aaron" }
]

dependencies = [
    "numpy",
    "pandas",
    "pyteomics",
    "pyopenms",
    "hydra-core",
    "omegaconf",
    "tqdm"
]

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "pytest",
    "pre-commit"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
